<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediScan - OTP Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0d4f3c 100%);
    }
    /* Animations */
    .floating-doctor { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(0deg);}25%{transform:translateY(-20px) rotate(2deg);}50%{transform:translateY(-10px) rotate(0deg);}75%{transform:translateY(-25px) rotate(-2deg);} }
    .pulse-ring { animation: pulseRing 2s infinite; }
    @keyframes pulseRing { 0%{transform:scale(0.8);opacity:1;}100%{transform:scale(2.4);opacity:0;} }
    .heartbeat { animation: heartbeat 2s infinite; }
    @keyframes heartbeat { 0%,100%{transform:scale(1);}50%{transform:scale(1.1);} }
    .slide-in { animation: slideIn 0.8s ease-out forwards; }
    @keyframes slideIn { from {opacity:0; transform:translateY(50px);} to {opacity:1; transform:translateY(0);} }
    .glow-effect { box-shadow: 0 0 20px rgba(34,197,94,0.3); animation: glow 3s ease-in-out infinite alternate; }
    @keyframes glow { from{box-shadow:0 0 20px rgba(34,197,94,0.3);} to{box-shadow:0 0 30px rgba(34,197,94,0.6);} }
    /* OTP Inputs */
    .otp-form { backdrop-filter: blur(20px); background: rgba(0,0,0,0.8); border: 1px solid rgba(34,197,94,0.3); }
    .otp-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(34,197,94,0.3);
      transition: all 0.3s ease;
    }
    .otp-input:focus {
      background: rgba(255,255,255,0.1);
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
      outline: none;
    }
    .verify-btn {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      transition: all 0.3s ease;
    }
    .verify-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(34,197,94,0.4);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden">

  <!-- Floating Animated Background -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
      <div class="absolute top-20 right-20 text-green-500 opacity-20">
          <i class="fas fa-plus medical-cross text-6xl"></i>
      </div>
      <div class="absolute bottom-32 left-20 text-green-400 opacity-15">
          <i class="fas fa-dna dna-helix text-5xl"></i>
      </div>
      <div class="absolute top-1/2 right-32 text-green-600 opacity-10">
          <i class="fas fa-stethoscope stethoscope-bounce text-7xl"></i>
      </div>
      <div class="absolute top-32 left-1/4 text-green-500 opacity-15">
          <i class="fas fa-heartbeat text-4xl heartbeat"></i>
      </div>
      <div class="absolute bottom-20 right-1/3 text-green-400 opacity-20">
          <i class="fas fa-user-md text-5xl floating-doctor"></i>
      </div>
      <div class="absolute top-1/4 left-1/3">
          <div class="w-4 h-4 bg-green-500 rounded-full opacity-30"></div>
          <div class="w-4 h-4 bg-green-500 rounded-full absolute top-0 left-0 pulse-ring opacity-20"></div>
      </div>
      <div class="absolute bottom-1/4 right-1/4">
          <div class="w-6 h-6 bg-green-400 rounded-full opacity-20"></div>
          <div class="w-6 h-6 bg-green-400 rounded-full absolute top-0 left-0 pulse-ring opacity-15"></div>
      </div>
      <div class="absolute top-1/3 right-1/5">
          <div class="w-3 h-3 bg-green-600 rounded-full opacity-25"></div>
          <div class="w-3 h-3 bg-green-600 rounded-full absolute top-0 left-0 pulse-ring opacity-10"></div>
      </div>
  </div>

  <!-- OTP Container -->
  <div class="w-full max-w-md mx-auto p-6 slide-in relative z-10">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-gradient-to-br from-green-400 to-green-600 rounded-2xl flex items-center justify-center mx-auto mb-4 glow-effect">
        <i class="fas fa-shield-alt text-white text-3xl heartbeat"></i>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">OTP Verification</h1>
      <p class="text-gray-400 text-sm">Enter the 4-digit code sent to your email</p>
    </div>

    <!-- OTP Form -->
    <div class="otp-form rounded-2xl p-8 glow-effect">
      <form id="otpForm" method="POST">
        {% csrf_token %}
        <div class="flex justify-between mb-6">
          <input type="text" maxlength="1" name="otp1" class="otp-input w-14 h-14 text-center text-2xl rounded-xl text-white" required>
          <input type="text" maxlength="1" name="otp2" class="otp-input w-14 h-14 text-center text-2xl rounded-xl text-white" required>
          <input type="text" maxlength="1" name="otp3" class="otp-input w-14 h-14 text-center text-2xl rounded-xl text-white" required>
          <input type="text" maxlength="1" name="otp4" class="otp-input w-14 h-14 text-center text-2xl rounded-xl text-white" required>
        </div>
        <button type="submit" class="verify-btn w-full py-3 px-4 rounded-xl text-white font-semibold text-lg flex items-center justify-center space-x-2">
          <i class="fas fa-check-circle"></i>
          <span>Verify OTP</span>
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="text-gray-400 text-sm">
          Didn’t get the code? 
          <a href="#" class="text-green-400 hover:text-green-300 font-medium">Resend</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if (input.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });
  </script>
</body>
</html>
