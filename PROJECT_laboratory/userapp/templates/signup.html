<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScan - Sign Up</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%2322c55e;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%2316a34a;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23grad)'/%3E%3Cpath d='M8 16c0-2 1-3 2-3s2 1 2 3-1 3-2 3-2-1-2-3zm6 0c0-2 1-3 2-3s2 1 2 3-1 3-2 3-2-1-2-3zm6 0c0-2 1-3 2-3s2 1 2 3-1 3-2 3-2-1-2-3z' fill='white'/%3E%3Cpath d='M10 13l2 3 2-3 2 3 2-3 2 3' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0d4f3c 100%);
        }
        
        .floating-doctor {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(2deg); }
            50% { transform: translateY(-10px) rotate(0deg); }
            75% { transform: translateY(-25px) rotate(-2deg); }
        }
        
        .pulse-ring {
            animation: pulseRing 2s infinite;
        }
        
        @keyframes pulseRing {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }
        
        .heartbeat {
            animation: heartbeat 2s infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .slide-in {
            animation: slideIn 0.8s ease-out forwards;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .glow-effect {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
            to { box-shadow: 0 0 30px rgba(34, 197, 94, 0.6); }
        }
        
        .medical-cross {
            animation: rotate 10s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .dna-helix {
            animation: dnaRotate 4s ease-in-out infinite;
        }
        
        @keyframes dnaRotate {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
        }
        
        .stethoscope-bounce {
            animation: bounce 3s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .signup-form {
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .input-field {
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }
        
        .signup-btn {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            transition: all 0.3s ease;
        }
        
        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
        }
        
        .signup-btn:active {
            transform: translateY(0);
        }
        
        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .strength-weak { background: #ef4444; width: 25%; }
        .strength-fair { background: #f59e0b; width: 50%; }
        .strength-good { background: #22c55e; width: 75%; }
        .strength-strong { background: #16a34a; width: 100%; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden">
    <!-- Animated Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <!-- Floating Medical Icons -->
        <div class="absolute top-20 right-20 text-green-500 opacity-20">
            <i class="fas fa-plus medical-cross text-6xl"></i>
        </div>
        <div class="absolute bottom-32 left-20 text-green-400 opacity-15">
            <i class="fas fa-dna dna-helix text-5xl"></i>
        </div>
        <div class="absolute top-1/2 right-32 text-green-600 opacity-10">
            <i class="fas fa-stethoscope stethoscope-bounce text-7xl"></i>
        </div>
        <div class="absolute top-32 left-1/4 text-green-500 opacity-15">
            <i class="fas fa-heartbeat text-4xl heartbeat"></i>
        </div>
        <div class="absolute bottom-20 right-1/3 text-green-400 opacity-20">
            <i class="fas fa-user-md text-5xl floating-doctor"></i>
        </div>
        
        <!-- Pulse Rings -->
        <div class="absolute top-1/4 left-1/3">
            <div class="w-4 h-4 bg-green-500 rounded-full opacity-30"></div>
            <div class="w-4 h-4 bg-green-500 rounded-full absolute top-0 left-0 pulse-ring opacity-20"></div>
        </div>
        <div class="absolute bottom-1/4 right-1/4">
            <div class="w-6 h-6 bg-green-400 rounded-full opacity-20"></div>
            <div class="w-6 h-6 bg-green-400 rounded-full absolute top-0 left-0 pulse-ring opacity-15"></div>
        </div>
        <div class="absolute top-1/3 right-1/5">
            <div class="w-3 h-3 bg-green-600 rounded-full opacity-25"></div>
            <div class="w-3 h-3 bg-green-600 rounded-full absolute top-0 left-0 pulse-ring opacity-10"></div>
        </div>
    </div>

    <!-- Main Signup Container -->
    <div class="w-full max-w-md mx-auto p-5 slide-in">
        <!-- Logo Section -->
        <div class="text-center mb-5">
            <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-green-600 rounded-xl flex items-center justify-center mx-auto mb-3 glow-effect">
                <i class="fas fa-heartbeat text-white text-xl heartbeat"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Join MediScan</h1>
            <p class="text-green-400 text-base">Create your account</p>
        </div>

        <!-- Signup Form -->
        <div class="signup-form rounded-xl p-6 glow-effect">
            <form id="signupForm" class="space-y-4" method="post">
                {% csrf_token %}
                <!-- Name Fields -->
                <div class="grid grid-cols-2 gap-3">
                    <!-- First Name -->
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-green-400 mb-2">
                            First Name
                        </label>
                        <input 
                            type="text" 
                            id="fnm" 
                            name="fnm"
                            required
                            class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-gray-400 focus:outline-none text-sm"
                            placeholder="First name"
                        >
                    </div>

                    <!-- Last Name -->
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-green-400 mb-2">
                            Last Name
                        </label>
                        <input 
                            type="text" 
                            id="lnm" 
                            name="lnm"
                            required
                            class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-gray-400 focus:outline-none text-sm"
                            placeholder="Last name"
                        >
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-green-400 mb-2">
                        <i class="fas fa-envelope mr-2"></i>Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        required
                        class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-gray-400 focus:outline-none text-sm"
                        placeholder="your@email.com"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-green-400 mb-2">
                        <i class="fas fa-lock mr-2"></i>Password
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            required
                            class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-gray-400 focus:outline-none pr-10 text-sm"
                            placeholder="Create password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-green-400 transition-colors"
                        >
                            <i class="fas fa-eye text-sm" id="eyeIcon"></i>
                        </button>
                    </div>
                    <!-- Password Strength Indicator -->
                    <div class="mt-1">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>Strength</span>
                            <span id="strengthText">Weak</span>
                        </div>
                        <div class="w-full bg-gray-700 rounded-full h-1">
                            <div id="strengthBar" class="password-strength bg-gray-700 rounded-full"></div>
                        </div>
                    </div>
                </div>

            <div id="passwordMatch" class="hidden text-sm mb-2"></div>


                <!-- Confirm Password -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-green-400 mb-2">
                        <i class="fas fa-lock mr-2"></i>Confirm Password
                    </label>
                    <input 
                        type="password" 
                        id="cpassword" 
                        name="cpassword"
                        required
                        class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-gray-400 focus:outline-none text-sm"
                        placeholder="Confirm password"
                    >
                    <div id="passwordMatch" class="mt-1 text-xs hidden">
                        <span class="text-red-400">Passwords do not match</span>
                    </div>
                </div>

                <!-- Terms and Conditions -->
                <div>
                    <label class="flex items-start space-x-3">
                        <input type="checkbox" id="terms" required class="w-5 h-5 text-green-600 bg-gray-800 border-gray-600 rounded focus:ring-green-500 mt-1">
                        <span class="text-sm text-gray-300">
                            I agree to the <a href="#" class="text-green-400 hover:text-green-300">Terms</a> and <a href="#" class="text-green-400 hover:text-green-300">Privacy Policy</a>
                        </span>
                    </label>
                </div>

                <!-- Signup Button -->
                <button 
                    type="submit" 
                    class="signup-btn w-full py-3 px-4 rounded-lg text-white font-semibold text-base flex items-center justify-center space-x-2"
                >
                    <i class="fas fa-user-plus"></i>
                    <span>Create Account</span>
                    
                </button>

                <!-- Login Link -->
                <div class="text-center mt-4">
                    <p class="text-gray-400 text-sm">
                        Already have an account? 
                        <a href="/login" class="text-green-400 hover:text-green-300 font-medium transition-colors">
                            Sign in
                        </a>
                    </p>
                </div>
            </form>
        </div>


    </div>

    <!-- Floating Doctor Animation -->
    <div class="fixed bottom-10 right-10 floating-doctor pointer-events-none z-40">
        <div class="relative">
            <!-- Doctor SVG -->
            <svg width="100" height="100" viewBox="0 0 120 120" class="drop-shadow-2xl opacity-60">
                <!-- Doctor Body -->
                <circle cx="60" cy="35" r="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
                <rect x="45" y="50" width="30" height="40" rx="15" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
                <rect x="50" y="55" width="20" height="30" fill="#22c55e"/>
                
                <!-- Stethoscope -->
                <path d="M55 60 Q50 65 55 70 Q60 65 65 70" stroke="#374151" stroke-width="3" fill="none"/>
                <circle cx="55" cy="70" r="3" fill="#374151"/>
                <circle cx="65" cy="70" r="3" fill="#374151"/>
                
                <!-- Medical Cross -->
                <rect x="57" y="58" width="6" height="12" fill="#ffffff"/>
                <rect x="54" y="61" width="12" height="6" fill="#ffffff"/>
                
                <!-- Arms -->
                <rect x="35" y="55" width="15" height="8" rx="4" fill="#fbbf24"/>
                <rect x="70" y="55" width="15" height="8" rx="4" fill="#fbbf24"/>
                
                <!-- Legs -->
                <rect x="50" y="85" width="8" height="20" rx="4" fill="#1f2937"/>
                <rect x="62" y="85" width="8" height="20" rx="4" fill="#1f2937"/>
                
                <!-- Medical Bag -->
                <rect x="75" y="65" width="12" height="8" rx="2" fill="#dc2626"/>
                <rect x="77" y="67" width="8" height="4" fill="#ffffff"/>
                <rect x="79" y="68" width="4" height="2" fill="#dc2626"/>
            </svg>
            
            <!-- Floating Plus Icons -->
            <div class="absolute -top-3 -left-3 text-green-400 opacity-70">
                <i class="fas fa-plus text-sm medical-cross"></i>
            </div>
            <div class="absolute -bottom-3 -right-3 text-green-500 opacity-60">
                <i class="fas fa-plus text-xs medical-cross" style="animation-delay: 1s;"></i>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elements
            const passworrdField = document.getElementById('password');
            const confirmmPasswordField = document.getElementById('confirmPassword');
            const togglePassword = document.getElementById('togglePassword');
            const eyeIcon = document.getElementById('eyeIcon');

            // Password toggle functionality
            togglePassword.addEventListener('click', function() {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                confirmPasswordField.setAttribute('type', type);
                
                if (type === 'password') {
                    eyeIcon.className = 'fas fa-eye';
                } else {
                    eyeIcon.className = 'fas fa-eye-slash';
                }
            });

            // Password strength checker
            passwordField.addEventListener('input', function() {
                const password = this.value;
                const strengthBar = document.getElementById('strengthBar');
                const strengthText = document.getElementById('strengthText');
                
                let strength = 0;
                let strengthLabel = 'Weak';
                let strengthClass = 'strength-weak';
                
                if (password.length >= 8) strength++;
                if (/[a-z]/.test(password)) strength++;
                if (/[A-Z]/.test(password)) strength++;
                if (/[0-9]/.test(password)) strength++;
                if (/[^A-Za-z0-9]/.test(password)) strength++;
                
                switch (strength) {
                    case 0:
                    case 1:
                        strengthLabel = 'Weak';
                        strengthClass = 'strength-weak';
                        break;
                    case 2:
                        strengthLabel = 'Fair';
                        strengthClass = 'strength-fair';
                        break;
                    case 3:
                    case 4:
                        strengthLabel = 'Good';
                        strengthClass = 'strength-good';
                        break;
                    case 5:
                        strengthLabel = 'Strong';
                        strengthClass = 'strength-strong';
                        break;
                }
                
                strengthBar.className = `password-strength ${strengthClass}`;
                strengthText.textContent = strengthLabel;
            });

            // Password match checker
            const passwordField = document.getElementById('password');
            const confirmPasswordField = document.getElementById('cpassword');
            const matchIndicator = document.getElementById('passwordMatch');
            const submitBtn = document.getElementById('submitBtn');

            function checkPasswordMatch() {
                const password = passwordField.value;
                const confirmPassword = confirmPasswordField.value;

                if (confirmPassword && password !== confirmPassword) {
                    matchIndicator.classList.remove('hidden');
                    matchIndicator.innerHTML = '<span class="text-red-500">❌ Passwords do not match</span>';
                    submitBtn.disabled = true; // prevent form submit
                } else if (confirmPassword && password === confirmPassword) {
                    matchIndicator.classList.remove('hidden');
                    matchIndicator.innerHTML = '<span class="text-green-500">✅ Passwords match</span>';
                    submitBtn.disabled = false;
                } else {
                    matchIndicator.classList.add('hidden');
                    submitBtn.disabled = true;
                }
            }

            confirmPasswordField.addEventListener('input', checkPasswordMatch);
            passwordField.addEventListener('input', checkPasswordMatch);

            confirmPasswordField.addEventListener('input', checkPasswordMatch);
            passwordField.addEventListener('input', checkPasswordMatch);

            // Form submission
            document.getElementById('signupForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const email = document.getElementById('email').value;
                const password = passwordField.value;
                const confirmPassword = confirmPasswordField.value;
                
                // Validation
                if (!firstName || !lastName || !email || !password || !confirmPassword) {
                    alert('Please fill in all fields');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }
                
                if (!document.getElementById('terms').checked) {
                    alert('Please accept the Terms of Service and Privacy Policy');
                    return;
                }
                
                // Add loading state to button
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalContent = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Creating Account...';
                submitBtn.disabled = true;
                
                // Simulate account creation
                setTimeout(() => {
                    // Reset button
                    submitBtn.innerHTML = originalContent;
                    submitBtn.disabled = false;
                    
                    // Show success message
                    alert(`Account created successfully!\n\nWelcome ${firstName} ${lastName}!\nEmail: ${email}\n\nYou can now sign in with your credentials.`);
                }, 2000);
            });

            // Add floating elements
            function createFloatingElement() {
                const element = document.createElement('div');
                const icons = ['fa-plus', 'fa-heartbeat', 'fa-stethoscope', 'fa-user-md'];
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                
                element.innerHTML = `<i class="fas ${randomIcon} text-green-500 opacity-20"></i>`;
                element.className = 'fixed pointer-events-none';
                element.style.left = Math.random() * window.innerWidth + 'px';
                element.style.top = window.innerHeight + 'px';
                element.style.fontSize = (Math.random() * 15 + 8) + 'px';
                element.style.animation = `floatUp ${Math.random() * 4 + 5}s linear forwards`;
                
                document.body.appendChild(element);
                
                setTimeout(() => {
                    element.remove();
                }, 9000);
            }
            
            // Create floating elements periodically
            setInterval(createFloatingElement, 4000);

            // Input field animations
            const inputs = document.querySelectorAll('.input-field');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.style.transform = 'scale(1)';
                });
            });
        });
        
        // Add CSS for floating up animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatUp {
                to {
                    transform: translateY(-${window.innerHeight + 100}px) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>

</html>
