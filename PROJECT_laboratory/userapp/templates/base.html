<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScan - Medical Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0d4f3c 100%);
        }

        .navbar-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .navbar-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(34, 197, 94, 0.2), transparent);
            transition: left 0.5s;
        }

        .navbar-item:hover::before {
            left: 100%;
        }

        .navbar-item:hover {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        }

        .navbar-item.active {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
        }

        .navbar-item:hover i {
            transform: scale(1.2) rotate(5deg);
            color: #ffffff;
        }

        .navbar-item i {
            transition: all 0.3s ease;
        }

        .floating-doctor {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            25% {
                transform: translateY(-20px) rotate(2deg);
            }

            50% {
                transform: translateY(-10px) rotate(0deg);
            }

            75% {
                transform: translateY(-25px) rotate(-2deg);
            }
        }

        .pulse-ring {
            animation: pulseRing 2s infinite;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }

            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }

        .heartbeat {
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .slide-in {
            animation: slideIn 0.8s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .glow-effect {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
            }

            to {
                box-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
            }
        }

        .medical-cross {
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .dna-helix {
            animation: dnaRotate 4s ease-in-out infinite;
        }

        @keyframes dnaRotate {

            0%,
            100% {
                transform: rotateY(0deg);
            }

            50% {
                transform: rotateY(180deg);
            }
        }

        .stethoscope-bounce {
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body class="min-h-screen overflow-hidden">
    <!-- Animated Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <!-- Floating Medical Icons -->
        <div class="absolute top-20 right-20 text-green-500 opacity-20">
            <i class="fas fa-plus medical-cross text-6xl"></i>
        </div>
        <div class="absolute bottom-32 left-20 text-green-400 opacity-15">
            <i class="fas fa-dna dna-helix text-5xl"></i>
        </div>
        <div class="absolute top-1/2 right-32 text-green-600 opacity-10">
            <i class="fas fa-stethoscope stethoscope-bounce text-7xl"></i>
        </div>

        <!-- Pulse Rings -->
        <div class="absolute top-1/4 left-1/3">
            <div class="w-4 h-4 bg-green-500 rounded-full opacity-30"></div>
            <div class="w-4 h-4 bg-green-500 rounded-full absolute top-0 left-0 pulse-ring opacity-20"></div>
        </div>
        <div class="absolute bottom-1/4 right-1/4">
            <div class="w-6 h-6 bg-green-400 rounded-full opacity-20"></div>
            <div class="w-6 h-6 bg-green-400 rounded-full absolute top-0 left-0 pulse-ring opacity-15"></div>
        </div>
    </div>
    <!-- Horizontal Navbar -->
    <nav
        class="fixed top-0 left-0 right-0 h-20 bg-black bg-opacity-90 backdrop-blur-lg border-b border-green-500 border-opacity-30 slide-in z-50">
        <div class="flex items-center justify-between h-full px-0">
            <!-- Left Side - Logo and MediScan Text -->
            <div class="flex items-center space-x-3 pl-6">
                <!-- Logo Placeholder - Replace src with your logo URL -->
                <img src="YOUR_LOGO_URL_HERE" alt="MediScan Logo" class="w-12 h-12 rounded-xl object-contain"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <!-- Fallback if logo fails to load -->
                <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-xl flex items-center justify-center glow-effect"
                    style="display: none;">
                    <i class="fas fa-heartbeat text-white text-xl heartbeat"></i>
                </div>

                <!-- MediScan Text -->
                <div>
                    <h1 class="text-2xl font-bold text-white">MediScan</h1>
                    <p class="text-green-400 text-xs">Healthcare Solutions</p>
                </div>
            </div>

            <!-- Center - Navigation Items -->
            <div class="flex items-center space-x-2">
                <a href="/"
                    class="sidebar-item active flex items-center space-x-2 px-4 py-2 rounded-xl text-white font-medium whitespace-nowrap">
                    <i class="fas fa-home text-lg"></i>
                    <span>Home</span>
                </a>
                <a href="/about"
                    class="sidebar-item flex items-center space-x-2 px-4 py-2 rounded-xl text-gray-300 hover:text-white font-medium whitespace-nowrap">
                    <i class="fas fa-info-circle text-lg"></i>
                    <span>About Us</span>
                </a>
                <a href="/booktest"
                    class="sidebar-item flex items-center space-x-2 px-4 py-2 rounded-xl text-gray-300 hover:text-white font-medium whitespace-nowrap">
                    <i class="fas fa-calendar-plus text-lg"></i>
                    <span>Book Test</span>
                </a>
                <a href="/reports"
                    class="sidebar-item flex items-center space-x-2 px-4 py-2 rounded-xl text-gray-300 hover:text-white font-medium whitespace-nowrap">
                    <i class="fas fa-file-medical-alt text-lg"></i>
                    <span>My Reports</span>
                </a>
                <a href="/contact"
                    class="sidebar-item flex items-center space-x-2 px-4 py-2 rounded-xl text-gray-300 hover:text-white font-medium whitespace-nowrap">
                    <i class="fas fa-phone-alt text-lg"></i>
                    <span>Contact Us</span>
                </a>
            </div>


            {% if user is none %}
            <!-- Right Side - Login & Logout -->
            <div class="flex items-center space-x-4 pr-6">
                <a href="/login"
                    class="px-6 py-2 rounded-xl font-medium text-black flex items-center transition-all duration-300 hover:shadow-lg hover:scale-105"
                    style="background-color: #33b80f;">
                    <i class="fas fa-sign-in-alt mr-2"></i> Login
                </a>

                {% else %}
                <div class="relative inline-block text-left mr-6">
                    <!-- Settings Icon -->
                    <button id="settingsBtn"
                        class="w-14 h-14 rounded-full bg-gray-800 text-white flex items-center justify-center hover:bg-gray-700">
                        <i class="fas fa-cog text-2xl"></i>
                    </button>

                    <!-- Dropdown Menu -->
                    <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-lg shadow-lg z-50">
                        <a href="/profile"
                            class="block px-4 py-2 text-gray-700 hover:bg-gray-100 flex items-center space-x-2">
                            <i class="fas fa-user"></i>
                            <span>Profile</span>
                        </a>
                        <a href="/userlogout"
                            class="block px-4 py-2 text-gray-700 hover:bg-gray-100 flex items-center space-x-2">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Logout</span>
                        </a>
                    </div>
                </div>

                {% endif %}
            </div>
        </div>
    </nav>




    <!-- Floating Doctor Animation -->
    <div class="fixed bottom-20 right-20 floating-doctor pointer-events-none z-40">
        <div class="relative">
            <!-- Doctor SVG -->
            <svg width="120" height="120" viewBox="0 0 120 120" class="drop-shadow-2xl">
                <!-- Doctor Body -->
                <circle cx="60" cy="35" r="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />
                <rect x="45" y="50" width="30" height="40" rx="15" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
                <rect x="50" y="55" width="20" height="30" fill="#22c55e" />

                <!-- Stethoscope -->
                <path d="M55 60 Q50 65 55 70 Q60 65 65 70" stroke="#374151" stroke-width="3" fill="none" />
                <circle cx="55" cy="70" r="3" fill="#374151" />
                <circle cx="65" cy="70" r="3" fill="#374151" />

                <!-- Medical Cross -->
                <rect x="57" y="58" width="6" height="12" fill="#ffffff" />
                <rect x="54" y="61" width="12" height="6" fill="#ffffff" />

                <!-- Arms -->
                <rect x="35" y="55" width="15" height="8" rx="4" fill="#fbbf24" />
                <rect x="70" y="55" width="15" height="8" rx="4" fill="#fbbf24" />

                <!-- Legs -->
                <rect x="50" y="85" width="8" height="20" rx="4" fill="#1f2937" />
                <rect x="62" y="85" width="8" height="20" rx="4" fill="#1f2937" />

                <!-- Medical Bag -->
                <rect x="75" y="65" width="12" height="8" rx="2" fill="#dc2626" />
                <rect x="77" y="67" width="8" height="4" fill="#ffffff" />
                <rect x="79" y="68" width="4" height="2" fill="#dc2626" />
            </svg>

            <!-- Floating Plus Icons -->
            <div class="absolute -top-5 -left-5 text-green-400 opacity-70">
                <i class="fas fa-plus text-lg medical-cross"></i>
            </div>
            <div class="absolute -bottom-5 -right-5 text-green-500 opacity-60">
                <i class="fas fa-plus text-sm medical-cross" style="animation-delay: 1s;"></i>
            </div>
        </div>
    </div>

    <!-- Main Content Area (Empty as requested) -->
    <main class="pt-20 min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div
                class="w-32 h-32 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center mx-auto mb-8 glow-effect">
                <i class="fas fa-user-md text-white text-5xl floating-doctor"></i>
            </div>
            <h2 class="text-4xl font-bold text-white mb-4">Welcome to MediScan</h2>
            <p class="text-green-400 text-xl">Your Health, Our Priority</p>
        </div>
    </main>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const btn = document.getElementById('settingsBtn');
            const menu = document.getElementById('dropdownMenu');

            if (!btn || !menu) return;

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                menu.classList.toggle('hidden');
            });

            window.addEventListener('click', () => {
                menu.classList.add('hidden');
            });
        });
    </script>

    <script>
        // Add interactive functionality
        document.addEventListener('DOMContentLoaded', function () {
            const navItems = document.querySelectorAll('.navbar-item');

            navItems.forEach(item => {
                item.addEventListener('click', function (e) {
                    e.preventDefault();

                    // Remove active class from all items
                    navItems.forEach(nav => nav.classList.remove('active'));

                    // Add active class to clicked item
                    this.classList.add('active');

                    // Add click animation
                    this.style.transform = 'translateX(12px) scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = 'translateX(8px) scale(1)';
                    }, 150);
                });

                // Add hover sound effect simulation
                item.addEventListener('mouseenter', function () {
                    const icon = this.querySelector('i');
                    icon.style.textShadow = '0 0 10px rgba(34, 197, 94, 0.8)';
                });

                item.addEventListener('mouseleave', function () {
                    const icon = this.querySelector('i');
                    icon.style.textShadow = 'none';
                });
            });

            // Add profile and logout button interactions
            const profileBtn = document.querySelector('button:has(.fa-user)');
            const logoutBtn = document.querySelector('button:has(.fa-sign-out-alt)');

            profileBtn.addEventListener('click', function () {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
            });

            logoutBtn.addEventListener('click', function () {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 150);
            });


            // Add random floating elements
            function createFloatingElement() {
                const element = document.createElement('div');
                element.innerHTML = '<i class="fas fa-plus text-green-500 opacity-20"></i>';
                element.className = 'fixed pointer-events-none';
                element.style.left = Math.random() * window.innerWidth + 'px';
                element.style.top = window.innerHeight + 'px';
                element.style.fontSize = (Math.random() * 20 + 10) + 'px';
                element.style.animation = `floatUp ${Math.random() * 3 + 4}s linear forwards`;

                document.body.appendChild(element);

                setTimeout(() => {
                    element.remove();
                }, 7000);
            }

            // Create floating elements periodically
            setInterval(createFloatingElement, 3000);
        });

        // Add CSS for floating up animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatUp {
                to {
                    transform: translateY(-${window.innerHeight + 100}px) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>

</body>

</html>
